name: Refresh Playlists Nightly

on:
  schedule:
    # Run daily at 4 AM EST (9 AM UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  refresh-playlists:
    runs-on: ubuntu-latest
    
    steps:
    - name: Refresh All Playlists
      run: |
        echo "🔄 Refreshing all playlists..."
        BASE_URL="${BASE_URL:-https://stablekraft.app}"
        
        # Step 1: Check the admin secret before anything else.
        # This is the job's only fatal step, and that is its whole purpose: every later
        # step is non-fatal, so with a mismatched ADMIN_SECRET they would each log a 401
        # warning and the run would still go green. /api/playlist-cache is fully gated
        # and a plain GET only returns cache stats, so it is a cheap auth probe.
        #
        # It used to be `?refresh=all`, which never refreshed anything: the route
        # re-fetched /api/playlist/<id>?refresh=true on its own origin, the connection
        # failed ("fetch failed" for all four playlists on every run checked), and it sent no
        # secret, so it would have got 401 anyway. It was also redundant — Step 3 and
        # Step 6 refresh all twelve playlists — and ran before Step 2's reparse.
        echo "📋 Step 1: Checking admin auth..."
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" "${BASE_URL}/api/playlist-cache") || HTTP_CODE=000

        if [ "$HTTP_CODE" -eq 200 ]; then
          echo "✅ Admin auth OK"
        else
          echo "❌ Admin auth check failed (HTTP $HTTP_CODE) — is the ADMIN_SECRET secret the same as Railway's?"
          exit 1
        fi

        # Playlist names used throughout
        PLAYLISTS=("hgh" "mmt" "sas" "mmm" "iam" "itdv" "b4ts" "upbeats" "flowgnar" "lt" "tft" "greatest-hits")

        # Step 2: Reparse ALL music feeds to detect new tracks FIRST
        # This must run BEFORE playlist refresh to catch new tracks
        echo ""
        echo "📋 Step 2: Reparsing music feeds to detect new tracks..."

        REPARSE_RESPONSE=$(curl -s -X POST -w "\n%{http_code}" -H "$AUTH_HEADER" "${BASE_URL}/api/admin/reparse-feeds?type=all&maxAgeHours=24&limit=5000") || REPARSE_RESPONSE=$'\n000'
        HTTP_CODE=$(echo "$REPARSE_RESPONSE" | tail -n1)
        RESPONSE_BODY=$(echo "$REPARSE_RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" -eq 200 ]; then
          PROCESSED=$(echo "$RESPONSE_BODY" | jq -r '.stats.feedsProcessed // 0' 2>/dev/null || echo "?")
          NEW_TRACKS=$(echo "$RESPONSE_BODY" | jq -r '.stats.newTracksAdded // 0' 2>/dev/null || echo "?")
          FAILED=$(echo "$RESPONSE_BODY" | jq -r '.stats.feedsFailed // 0' 2>/dev/null || echo "?")
          DURATION=$(echo "$RESPONSE_BODY" | jq -r '.duration // "?"' 2>/dev/null || echo "?")
          echo "✅ Music feeds reparsed: ${PROCESSED} feeds, ${NEW_TRACKS} new tracks, ${FAILED} failed (${DURATION})"
        else
          echo "⚠️ Music feed reparse had issues (HTTP $HTTP_CODE) - continuing..."
        fi

        # Step 2b: Reparse podcast feeds (curated list — these are blacklisted from album view)
        # Uses per-feed reparse endpoint to ensure each podcast gets fresh episodes
        echo ""
        echo "📋 Step 2b: Reparsing podcast feeds for new episodes..."

        PODCAST_FEEDS=("3aebb7a8-5942-5ee7-a148-8bdc14f1f3d4" "silvie-two-for-tunestr")  # UpBeats, Two For Tunestr

        for FEED_ID in "${PODCAST_FEEDS[@]}"; do
          echo "  🔄 Reparsing podcast feed $FEED_ID..."
          PODCAST_REPARSE=$(curl -s -X POST -w "\n%{http_code}" -H "$AUTH_HEADER" "${BASE_URL}/api/admin/feeds/${FEED_ID}/reparse")
          HTTP_CODE=$(echo "$PODCAST_REPARSE" | tail -n1)
          RESPONSE_BODY=$(echo "$PODCAST_REPARSE" | sed '$d')
          if [ "$HTTP_CODE" -eq 200 ]; then
            NEW=$(echo "$RESPONSE_BODY" | jq -r '.newTracks // 0' 2>/dev/null || echo "?")
            TITLE=$(echo "$RESPONSE_BODY" | jq -r '.title // "?"' 2>/dev/null || echo "?")
            echo "  ✓ ${TITLE} reparsed: ${NEW} new episodes"
          else
            echo "  ⚠️ Podcast feed $FEED_ID reparse had issues (HTTP $HTTP_CODE) - continuing..."
          fi
          sleep 2
        done

        # Step 2c: Fix stale VTS data (empty remoteItem GUIDs from pre-entity-fix parsing)
        echo ""
        echo "📋 Step 2c: Fixing stale VTS data..."

        VTS_FIX_RESPONSE=$(curl -s -X POST -w "\n%{http_code}" -H "$AUTH_HEADER" "${BASE_URL}/api/admin/fix-stale-vts") || VTS_FIX_RESPONSE=$'\n000'
        HTTP_CODE=$(echo "$VTS_FIX_RESPONSE" | tail -n1)
        RESPONSE_BODY=$(echo "$VTS_FIX_RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" -eq 200 ]; then
          FEEDS_FIXED=$(echo "$RESPONSE_BODY" | jq -r '.feedsFixed // 0' 2>/dev/null || echo "?")
          TRACKS_UPDATED=$(echo "$RESPONSE_BODY" | jq -r '.tracksUpdated // 0' 2>/dev/null || echo "?")
          DURATION=$(echo "$RESPONSE_BODY" | jq -r '.duration // "?"' 2>/dev/null || echo "?")
          echo "✅ Stale VTS fix: ${FEEDS_FIXED} feeds, ${TRACKS_UPDATED} tracks updated (${DURATION})"
        else
          echo "⚠️ Stale VTS fix had issues (HTTP $HTTP_CODE) - non-critical"
        fi

        # Step 2d: Recover feeds stuck in 'error' from a transient reparse failure.
        # A momentary fetch hiccup during Step 2/2b flips a healthy feed to
        # status='error', and nothing flips it back — so it silently vanishes from
        # the album grid and Podcasts tab until a manual reparse. This re-activates
        # any error'd feed that still has tracks (cached content is better than a
        # disappeared feed); a genuinely-dead feed with zero tracks stays hidden.
        echo ""
        echo "📋 Step 2d: Recovering feeds stuck in error status..."

        FIX_STATUS_RESPONSE=$(curl -s -X POST -w "\n%{http_code}" -H "$AUTH_HEADER" "${BASE_URL}/api/admin/fix-feed-status") || FIX_STATUS_RESPONSE=$'\n000'
        HTTP_CODE=$(echo "$FIX_STATUS_RESPONSE" | tail -n1)
        RESPONSE_BODY=$(echo "$FIX_STATUS_RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" -eq 200 ]; then
          FEEDS_RECOVERED=$(echo "$RESPONSE_BODY" | jq -r '.feeds | length' 2>/dev/null || echo "?")
          echo "✅ Feed status recovery: ${FEEDS_RECOVERED} feed(s) flipped error → active"
          echo "$RESPONSE_BODY" | jq -r '.feeds[]? | "  ↳ \(.title) (\(.trackCount) tracks)"' 2>/dev/null || true
        else
          echo "⚠️ Feed status recovery had issues (HTTP $HTTP_CODE) - non-critical"
        fi

        # Step 2e: Backfill missing release dates.
        # Read paths resolve releaseDate as `oldestItemPubdate || createdAt`, so a
        # feed with a null column reports the date it was ADDED to StableKraft as
        # its release year (issue #169 — a 2025 album displaying "2026"). Import
        # paths now set the column themselves; this is the safety net for feeds
        # that arrive by any path that doesn't, and for historical rows.
        echo ""
        echo "📋 Step 2e: Backfilling missing release dates (oldestItemPubdate)..."

        PUBDATE_RESPONSE=$(curl -s -X POST -w "\n%{http_code}" -H "$AUTH_HEADER" "${BASE_URL}/api/admin/backfill-oldest-pubdate") || PUBDATE_RESPONSE=$'\n000'
        HTTP_CODE=$(echo "$PUBDATE_RESPONSE" | tail -n1)
        RESPONSE_BODY=$(echo "$PUBDATE_RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" -eq 200 ]; then
          PUBDATE_UPDATED=$(echo "$RESPONSE_BODY" | jq -r '.updated' 2>/dev/null || echo "?")
          PUBDATE_SKIPPED=$(echo "$RESPONSE_BODY" | jq -r '.skipped' 2>/dev/null || echo "?")
          echo "✅ Release dates: ${PUBDATE_UPDATED} backfilled, ${PUBDATE_SKIPPED} skipped (no dated tracks)"
        else
          echo "⚠️ Release date backfill had issues (HTTP $HTTP_CODE) - non-critical"
        fi

        # Step 3: Refresh playlists with full v4v parsing
        echo ""
        echo "📋 Step 3: Refreshing playlists with full RSS parsing (includes v4v payment data)..."

        for PLAYLIST in "${PLAYLISTS[@]}"; do
          echo "  🔄 Refreshing $PLAYLIST playlist..."
          curl -s -H "$AUTH_HEADER" "${BASE_URL}/api/playlist/${PLAYLIST}?refresh=true" > /dev/null

          if [ $? -eq 0 ]; then
            echo "  ✓ $PLAYLIST refreshed"
          else
            echo "  ⚠️ $PLAYLIST refresh had issues (non-critical)"
          fi

          # Small delay to avoid rate limiting
          sleep 2
        done

        echo ""
        echo "✅ All playlists refreshed with full v4v parsing"

        # Step 4: Parse newly discovered feeds
        echo ""
        echo "📋 Step 4: Parsing newly discovered feeds..."

        # Parse feeds multiple times to ensure all feeds are processed
        # (parse-feeds processes 50 feeds at a time)
        MAX_ITERATIONS=10
        ITERATION=0

        while [ $ITERATION -lt $MAX_ITERATIONS ]; do
          ITERATION=$((ITERATION + 1))
          echo "  🔄 Parse iteration $ITERATION/$MAX_ITERATIONS..."

          PARSE_RESPONSE=$(curl -s -X POST -w "\n%{http_code}" -H "$AUTH_HEADER" "${BASE_URL}/api/playlist/parse-feeds")
          HTTP_CODE=$(echo "$PARSE_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$PARSE_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -eq 200 ]; then
            # Check if any feeds were parsed
            PARSED_COUNT=$(echo "$RESPONSE_BODY" | jq -r '.parsed // 0' 2>/dev/null || echo "0")

            if [ "$PARSED_COUNT" -eq 0 ]; then
              echo "  ✅ No more unparsed feeds found"
              break
            else
              echo "  ✓ Parsed $PARSED_COUNT feeds"
              # Small delay between iterations
              sleep 3
            fi
          else
            echo "  ⚠️ Parse iteration failed (HTTP $HTTP_CODE), continuing..."
            break
          fi
        done

        echo ""
        echo "✅ Feed parsing completed - tracks saved to database"

        # Step 5: Parse publisher feeds to update album relationships
        echo ""
        echo "📋 Step 5: Parsing publisher feeds to update album relationships..."

        PUBLISHER_RESPONSE=$(curl -s -X POST -w "\n%{http_code}" -H "$AUTH_HEADER" "${BASE_URL}/api/parse-feeds?action=parse-publishers") || PUBLISHER_RESPONSE=$'\n000'
        HTTP_CODE=$(echo "$PUBLISHER_RESPONSE" | tail -n1)
        RESPONSE_BODY=$(echo "$PUBLISHER_RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" -eq 200 ]; then
          PARSED=$(echo "$RESPONSE_BODY" | jq -r '.result.parsed // 0' 2>/dev/null || echo "?")
          LINKED=$(echo "$RESPONSE_BODY" | jq -r '.result.linked // 0' 2>/dev/null || echo "?")
          echo "✅ Publisher feeds parsed: ${PARSED} feeds processed, ${LINKED} albums linked"
        else
          echo "⚠️ Publisher parsing had issues (HTTP $HTTP_CODE) - non-critical"
        fi

        # Step 5b: Import missing albums from publisher feeds
        echo ""
        echo "📋 Step 5b: Importing missing albums from publisher feeds..."

        IMPORT_RESPONSE=$(curl -s -X POST -w "\n%{http_code}" -H "$AUTH_HEADER" "${BASE_URL}/api/admin/publishers/import-albums") || IMPORT_RESPONSE=$'\n000'
        HTTP_CODE=$(echo "$IMPORT_RESPONSE" | tail -n1)
        RESPONSE_BODY=$(echo "$IMPORT_RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" -eq 200 ]; then
          IMPORTED=$(echo "$RESPONSE_BODY" | jq -r '.totals.imported // 0' 2>/dev/null || echo "?")
          SKIPPED=$(echo "$RESPONSE_BODY" | jq -r '.totals.skipped // 0' 2>/dev/null || echo "?")
          echo "✅ Publisher album import: ${IMPORTED} imported, ${SKIPPED} skipped"

          # Step 5c: Reparse each newly imported feed from its real RSS.
          # PI API misses podcast:episode/podcast:season track ordering,
          # chapters, and VTS — reparse reads the feed XML directly and
          # fixes all of them. Only runs for feeds created this run, so
          # fetch volume stays tiny (no Wavlake rate-limit risk).
          NEW_FEED_IDS=$(echo "$RESPONSE_BODY" | jq -r '.importedFeedIds[]?' 2>/dev/null)
          if [ -n "$NEW_FEED_IDS" ]; then
            echo ""
            echo "📋 Step 5c: Reparsing newly imported feeds from RSS..."
            while IFS= read -r FEED_ID; do
              [ -z "$FEED_ID" ] && continue
              echo "  🔄 Reparsing $FEED_ID..."
              REPARSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "$AUTH_HEADER" "${BASE_URL}/api/admin/feeds/${FEED_ID}/reparse") || REPARSE_CODE=000
              if [ "$REPARSE_CODE" -eq 200 ]; then
                echo "  ✓ $FEED_ID reparsed"
              else
                echo "  ⚠️ $FEED_ID reparse failed (HTTP $REPARSE_CODE) - non-critical"
              fi
              sleep 2
            done <<< "$NEW_FEED_IDS"
          else
            echo "ℹ️ No newly imported feeds to reparse"
          fi
        else
          echo "⚠️ Publisher album import had issues (HTTP $HTTP_CODE) - non-critical"
        fi

        # Step 5d: Import new albums from artists already on the site that have
        # NO publisher feed (e.g. self-hosted artists like leuenbergmusic.com).
        # PI-searches each existing artist by name and imports a found album only
        # when its host matches one the artist already uses. Paginated — loop
        # until nextOffset is null. Newly minted feeds are reparsed from RSS
        # afterward (same Step 5c rationale: PI misses episode order/chapters/VTS).
        echo ""
        echo "📋 Step 5d: Importing new albums from existing artists (no publisher feed)..."

        ARTIST_OFFSET=0
        ARTIST_NEW_FEED_IDS=""
        while : ; do
          ARTIST_RESPONSE=$(curl -s -X POST -w "\n%{http_code}" -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            -d "{\"limit\":50,\"offset\":${ARTIST_OFFSET}}" \
            "${BASE_URL}/api/admin/artists/import-new-albums") || ARTIST_RESPONSE=$'\n000'
          HTTP_CODE=$(echo "$ARTIST_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$ARTIST_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "⚠️ Artist album import had issues (HTTP $HTTP_CODE) at offset ${ARTIST_OFFSET} - non-critical"
            break
          fi

          A_IMPORTED=$(echo "$RESPONSE_BODY" | jq -r '.totals.imported // 0' 2>/dev/null || echo "?")
          A_SKIPPED=$(echo "$RESPONSE_BODY" | jq -r '.totals.skipped // 0' 2>/dev/null || echo "?")
          A_TOTAL=$(echo "$RESPONSE_BODY" | jq -r '.totalArtists // 0' 2>/dev/null || echo "?")
          echo "  ✓ offset ${ARTIST_OFFSET}/${A_TOTAL}: ${A_IMPORTED} imported, ${A_SKIPPED} skipped"

          PAGE_IDS=$(echo "$RESPONSE_BODY" | jq -r '.importedFeedIds[]?' 2>/dev/null)
          [ -n "$PAGE_IDS" ] && ARTIST_NEW_FEED_IDS="${ARTIST_NEW_FEED_IDS}"$'\n'"${PAGE_IDS}"

          NEXT_OFFSET=$(echo "$RESPONSE_BODY" | jq -r '.nextOffset // empty' 2>/dev/null)
          if [ -z "$NEXT_OFFSET" ]; then
            break
          fi
          ARTIST_OFFSET="$NEXT_OFFSET"
          sleep 1
        done

        # Reparse each newly imported artist feed from its real RSS.
        ARTIST_NEW_FEED_IDS=$(echo "$ARTIST_NEW_FEED_IDS" | sed '/^$/d')
        if [ -n "$ARTIST_NEW_FEED_IDS" ]; then
          echo ""
          echo "📋 Step 5d-reparse: Reparsing newly imported artist feeds from RSS..."
          while IFS= read -r FEED_ID; do
            [ -z "$FEED_ID" ] && continue
            echo "  🔄 Reparsing $FEED_ID..."
            REPARSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "$AUTH_HEADER" "${BASE_URL}/api/admin/feeds/${FEED_ID}/reparse") || REPARSE_CODE=000
            if [ "$REPARSE_CODE" -eq 200 ]; then
              echo "  ✓ $FEED_ID reparsed"
            else
              echo "  ⚠️ $FEED_ID reparse failed (HTTP $REPARSE_CODE) - non-critical"
            fi
            sleep 2
          done <<< "$ARTIST_NEW_FEED_IDS"
        else
          echo "ℹ️ No newly imported artist feeds to reparse"
        fi

        # Step 6: Final playlist refresh to include newly parsed tracks
        echo ""
        echo "📋 Step 6: Final playlist refresh to include newly parsed tracks in SystemPlaylist..."

        for PLAYLIST in "${PLAYLISTS[@]}"; do
          echo "  🔄 Final refresh $PLAYLIST..."
          curl -s -H "$AUTH_HEADER" "${BASE_URL}/api/playlist/${PLAYLIST}?refresh=true" > /dev/null

          if [ $? -eq 0 ]; then
            echo "  ✓ $PLAYLIST updated with new tracks"
          else
            echo "  ⚠️ $PLAYLIST final refresh had issues (non-critical)"
          fi

          sleep 2
        done

        echo ""
        echo "✅ All playlists updated with newly parsed tracks"

        echo ""
        echo "✨ Playlist refresh workflow completed"

        # Step 7: Prune diagnostics older than 30 days
        echo ""
        echo "📋 Step 7: Pruning old diagnostics..."

        PRUNE_RESPONSE=$(curl -s -X DELETE -w "\n%{http_code}" -H "$AUTH_HEADER" "${BASE_URL}/api/admin/diagnostics?olderThanDays=30") || PRUNE_RESPONSE=$'\n000'
        HTTP_CODE=$(echo "$PRUNE_RESPONSE" | tail -n1)
        RESPONSE_BODY=$(echo "$PRUNE_RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" -eq 200 ]; then
          echo "✅ Diagnostics pruned"
          echo "$RESPONSE_BODY" | jq '.deleted' || echo "$RESPONSE_BODY"
        else
          echo "⚠️ Failed to prune diagnostics (HTTP $HTTP_CODE) — non-fatal"
        fi
      env:
        BASE_URL: ${{ secrets.PLAYLIST_BASE_URL || 'https://stablekraft.app' }}
        # Harmless while ADMIN_SECRET is unset on the server (fail-open).
        AUTH_HEADER: "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}"

