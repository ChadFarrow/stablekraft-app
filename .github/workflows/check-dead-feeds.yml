name: Check Dead Feeds

# Weekly "did an artist take their catalog down?" sweep. A feed is a candidate
# when PodcastIndex crawled it as dead, when our own refresh recorded a 404/410,
# or when PI's record for its guid now lives on another host. Each candidate is
# confirmed with a direct 404/410 fetch; then it is MOVED to its new home (same
# podcast:guid and item guids, verified live; the URL and every track's audio move
# in one transaction) or HIDDEN via markedDead, but only when none of its tracks
# still plays (one that plays goes to review). Moved feeds are then refreshed for
# their artwork and metadata. Hiding is reversible
# from the admin "Hide Feed" card, and the run's JSON report (logged below) is
# the audit trail of what was moved and hidden each week.
#
# Rare-but-real problem: a taken-down feed keeps showing because its tracks are
# cached in the DB. See /api/admin/check-dead-feeds and the "Hiding Feeds" /
# "Dead-feed check" section of CLAUDE.md.

on:
  schedule:
    # Weekly, Monday 10:00 UTC. GitHub Actions cron can drift ~15 min — fine here.
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  check-dead-feeds:
    runs-on: ubuntu-latest

    steps:
    - name: Check for dead feeds (signals -> confirm 404/410 -> move or hide)
      run: |
        BASE_URL="${BASE_URL:-https://stablekraft.app}"
        LIMIT=300
        OFFSET=0
        TOTAL_HIDDEN=0
        TOTAL_REVIEW=0
        TOTAL_MOVED=0
        PAGE=0
        FAILED=0
        MOVED_URLS=$(mktemp)

        echo "🔎 Checking for dead feeds at $(date -u)"

        # The active-feed set is thousands of feeds and each request handles a
        # bounded slice, so loop until the endpoint reports nextOffset=null.
        while :; do
          PAGE=$((PAGE + 1))
          # `|| true`: the step runs under `bash -e`, and a curl failure (timeout,
          # refused connection) must reach the check below, not end the step before
          # the moved feeds from earlier pages are refreshed.
          RESP=$(curl -s --max-time 300 -X POST -w "\n%{http_code}" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            -d "{\"limit\":${LIMIT},\"offset\":${OFFSET}}" \
            "${BASE_URL}/api/admin/check-dead-feeds") || true
          HTTP_CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Dead-feed check issue on page ${PAGE} (HTTP ${HTTP_CODE:-none})"
            echo "$BODY"
            # Stop the scan, but still refresh what earlier pages moved; fail at the end.
            FAILED=1
            break
          fi

          echo "── page ${PAGE}: $(echo "$BODY" | jq -r '.message' 2>/dev/null || echo "$BODY")"
          # Log any feed actually moved or hidden this page (the audit trail).
          echo "$BODY" | jq -c '.relocated[]? | {moved: .id, title, artist, from: .url, to}' 2>/dev/null || true
          echo "$BODY" | jq -r '.relocated[]?.to' 2>/dev/null >> "$MOVED_URLS" || true
          echo "$BODY" | jq -c '.hidden[]? | {id,title,artist,piDead,httpStatus,signals,reason}' 2>/dev/null || true
          echo "$BODY" | jq -c '.needsReview[]? | {id,title,artist,httpStatus,reason}' 2>/dev/null || true

          HID=$(echo "$BODY" | jq -r '.hiddenCount // 0' 2>/dev/null || echo 0)
          REVIEW=$(echo "$BODY" | jq -r '.needsReview | length' 2>/dev/null || echo 0)
          MOVED=$(echo "$BODY" | jq -r '.relocatedCount // 0' 2>/dev/null || echo 0)
          TOTAL_HIDDEN=$((TOTAL_HIDDEN + HID))
          TOTAL_MOVED=$((TOTAL_MOVED + MOVED))
          TOTAL_REVIEW=$((TOTAL_REVIEW + REVIEW))

          NEXT=$(echo "$BODY" | jq -r '.nextOffset // "null"' 2>/dev/null || echo "null")
          [ "$NEXT" = "null" ] && break
          OFFSET=$NEXT
        done

        # The move already re-pointed every track's audio (same transaction as the
        # URL), so a moved album plays now. This refresh brings the rest from the new
        # feed — track artwork, titles, value splits. A failed refresh leaves the album
        # playable; it is logged and the loop goes on. Paced under its 30/min/IP limit.
        REFRESHED=0
        while read -r URL; do
          [ -z "$URL" ] && continue
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg u "$URL" '{originalUrl: $u}')" \
            "${BASE_URL}/api/feeds/refresh-by-url") || true
          [ "$CODE" = "200" ] && REFRESHED=$((REFRESHED + 1))
          echo "🔄 refreshed moved feed ${URL}: HTTP ${CODE:-none}"
          sleep 3
        done < "$MOVED_URLS"

        if [ "$FAILED" -ne 0 ]; then
          echo "❌ Dead-feed check stopped early on page ${PAGE}: moved ${TOTAL_MOVED} feed(s) (refreshed ${REFRESHED}), hid ${TOTAL_HIDDEN}, ${TOTAL_REVIEW} need review"
          exit 1
        fi
        echo "✅ Dead-feed check complete: moved ${TOTAL_MOVED} feed(s) (refreshed ${REFRESHED}), hid ${TOTAL_HIDDEN}, ${TOTAL_REVIEW} need review (${PAGE} page(s))"
      env:
        BASE_URL: ${{ secrets.PLAYLIST_BASE_URL || 'https://stablekraft.app' }}
        # Harmless while ADMIN_SECRET is unset on the server (fail-open).
        AUTH_HEADER: "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}"
